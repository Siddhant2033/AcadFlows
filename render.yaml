services:
  - type: web
    name: acadflows-api
    env: node
    buildCommand: pnpm install && pnpm build:api
    startCommand: pnpm start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false