services:
  - type: web
    name: acadflows-api
    env: node

    buildCommand: pnpm install --frozen-lockfile && pnpm build:shared && pnpm build:api

    startCommand: pnpm --filter @acadflows/api start

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: FRONTEND_URL
        sync: false